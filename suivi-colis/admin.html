<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gestion des colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Concept : tableau de bord de quai. Bandeau sombre, cinq phases colorees, liste des colis dessous. */
  :root {
    --bg: #f3f6fb; --surface: #ffffff; --ink: #0b1324; --mut: #64748b; --line: #e6ebf2; --row: #f8fafc; --hover: #f5f8fc;
    --accent: #0d9488; --accent-2: #0ea5e9; --accent-ink: #ffffff; --accent-soft: #ccfbf1; --track: #e2e8f0;
    --hero-a: #0b1324; --hero-b: #0f3b4a;
    --warn: #b45309; --warn-soft: #fef3c7; --ok: #047857; --ok-soft: #d1fae5;
    --err: #b91c1c; --err-soft: #fee2e2;
    --c-prep: #6366f1; --c-mer: #0ea5e9; --c-port: #f59e0b; --c-retrait: #a855f7; --c-livre: #10b981;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 30px rgba(15,23,42,.06);
    --f-display: "Inter Display", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #070d18; --surface: #0f1726; --ink: #e8eef6; --mut: #8a9bb0; --line: #1e2a3d; --row: #0b1220; --hover: #121c2e;
    --accent: #2dd4bf; --accent-2: #38bdf8; --accent-ink: #04201c; --accent-soft: #0f3a37; --track: #1e2a3d;
    --hero-a: #0f1d33; --hero-b: #0d4a54;
    --warn: #fbbf24; --warn-soft: #3a2a08; --ok: #34d399; --ok-soft: #0b3326;
    --err: #fca5a5; --err-soft: #3d1414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #070d18; --surface: #0f1726; --ink: #e8eef6; --mut: #8a9bb0; --line: #1e2a3d; --row: #0b1220; --hover: #121c2e;
    --accent: #2dd4bf; --accent-2: #38bdf8; --accent-ink: #04201c; --accent-soft: #0f3a37; --track: #1e2a3d;
    --hero-a: #0f1d33; --hero-b: #0d4a54;
    --warn: #fbbf24; --warn-soft: #3a2a08; --ok: #34d399; --ok-soft: #0b3326;
    --err: #fca5a5; --err-soft: #3d1414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
         padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .shell { max-width: 1080px; margin: 0 auto; }
  h1, h2 { font-family: var(--f-display); margin: 0; letter-spacing: -.02em; }
  h1 { font-size: 24px; font-weight: 800; }
  h2 { font-size: 17px; font-weight: 700; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
  input, select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; font: 15px var(--f-body); background: var(--surface); color: var(--ink);
                  transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); outline: none; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
  button { padding: 11px 18px; border: 0; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
           font: 600 14px var(--f-body); cursor: pointer; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); }
  button.sec { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  button.sec:hover { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  button.sm { padding: 7px 13px; font-size: 13px; }
  button:disabled { opacity: .6; cursor: default; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
  .mut { color: var(--mut); font-size: 13px; }
  .mono { font-family: var(--f-mono); font-weight: 600; letter-spacing: .03em; font-size: 14px; }
  .msg { padding: 12px 15px; border-radius: 12px; font-size: 14px; font-weight: 500; margin-bottom: 14px; }
  .msg.err { background: var(--err-soft); color: var(--err); }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }

  #login { max-width: 400px; margin: 12vh auto 0; }
  #login h1 { margin-bottom: 4px; }
  #login .mut { margin: 0 0 18px; }
  #login form > div + div { margin-top: 12px; }

  /* Bandeau */
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 20px 0 18px; padding: 22px 24px;
               border-radius: 20px; color: #f8fafc;
               background: radial-gradient(520px 220px at 100% 0%, rgba(45,212,191,.32), transparent 70%), linear-gradient(140deg, var(--hero-a), var(--hero-b)); }
  header.top .mut { color: #94a3b8; }
  header.top button.sec { background: rgba(255,255,255,.08); color: #f8fafc; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }

  /* Phases */
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .stat { --c: var(--accent); position: relative; overflow: hidden; text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
          border-radius: 16px; padding: 16px 16px 14px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--c); }
  .stat::after { content: ""; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 50%; background: var(--c); opacity: .09; }
  .stat:hover { transform: translateY(-2px); }
  .stat .n { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; display: block; color: var(--c); }
  .stat .t { font-size: 13px; font-weight: 500; color: var(--mut); display: block; margin-top: 8px; }
  .stat[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }

  .panel { margin-top: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .bar input { flex: 1 1 200px; min-width: 0; background: var(--row); }
  .bar select { width: auto; flex: 0 1 220px; background: var(--row); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:not(.detail):hover td { background: var(--hover); }
  tr:last-child td { border-bottom: 0; }
  .pill { --c: var(--accent); display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
          background: color-mix(in srgb, var(--c) 12%, transparent); color: color-mix(in srgb, var(--c) 80%, var(--ink)); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .mini { --c: var(--accent); height: 5px; border-radius: 3px; background: var(--track); margin-top: 8px; min-width: 100px; max-width: 160px; }
  .mini span { display: block; height: 100%; border-radius: 3px; background: var(--c); }
  .detail td { background: var(--row); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .events { margin: 14px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--mut); display: grid; gap: 6px; }
  .events li { position: relative; padding-left: 16px; }
  .events li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  #empty { text-align: center; padding: 28px 0 10px; }
  :is(.stat, .pill, .mini)[data-phase="prep"] { --c: var(--c-prep); } :is(.stat, .pill, .mini)[data-phase="mer"] { --c: var(--c-mer); }
  :is(.stat, .pill, .mini)[data-phase="port"] { --c: var(--c-port); } :is(.stat, .pill, .mini)[data-phase="retrait"] { --c: var(--c-retrait); }
  :is(.stat, .pill, .mini)[data-phase="livre"] { --c: var(--c-livre); }
  [hidden] { display: none !important; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hide-m { display: none; } }
</style>
</head>
<body>
<div class="shell">

  <section id="login" class="card" hidden>
    <h1>Connexion</h1>
    <p class="mut">Espace réservé au transitaire.</p>
    <form id="login-form">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="pwd">Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" required></div>
      <button type="submit" style="margin-top:16px;width:100%">Se connecter</button>
    </form>
    <div id="login-msg" class="msg err" style="margin:14px 0 0" hidden></div>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div><h1 id="company">Gestion des colis</h1><div class="mut" id="who"></div></div>
      <button class="sec sm" id="logout" type="button">Déconnexion</button>
    </header>

    <div id="app-msg" class="msg" role="status" hidden></div>

    <div class="stats" id="stats"></div>

    <div class="card panel">
      <div class="panel-head">
        <h2>Nouveau colis</h2>
        <button class="sec sm" id="toggle-new" type="button" aria-expanded="false" aria-controls="new-form">Ouvrir le formulaire</button>
      </div>
      <form id="new-form" hidden>
        <div class="grid">
          <div><label for="n-client">Client</label><input id="n-client" required></div>
          <div><label for="n-phone">WhatsApp (format international)</label><input id="n-phone" placeholder="24101234567" inputmode="numeric"></div>
          <div><label for="n-desc">Contenu</label><input id="n-desc"></div>
          <div><label for="n-weight">Poids (kg)</label><input id="n-weight" type="number" step="0.01" min="0"></div>
          <div><label for="n-cont">Conteneur</label><input id="n-cont"></div>
          <div><label for="n-eta">Arrivée estimée</label><input id="n-eta" type="date"></div>
        </div>
        <div class="actions"><button type="submit">Enregistrer le colis</button></div>
      </form>
    </div>

    <div class="card panel">
      <div class="panel-head"><h2>Colis</h2></div>
      <div class="bar">
        <input id="search" placeholder="Rechercher un client, un code, un conteneur" aria-label="Rechercher">
        <select id="filter" aria-label="Filtrer par statut"></select>
        <button class="sec" id="refresh" type="button">Actualiser</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Client</th><th class="hide-m">Contenu</th><th>Statut</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="mut" id="empty" hidden>Aucun colis pour cette sélection.</p>
    </div>
  </section>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
