<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Concept : un trajet lu de gauche a droite. Carte de statut sombre, etapes datees en dessous. */
  :root {
    --bg: #f3f6fb; --surface: #ffffff; --ink: #0b1324; --mut: #64748b; --line: #e6ebf2;
    --accent: #0d9488; --accent-2: #0ea5e9; --accent-ink: #ffffff; --accent-soft: #ccfbf1; --track: #e2e8f0;
    --hero-a: #0b1324; --hero-b: #0f3b4a; --hero-ink: #f8fafc; --hero-mut: #94a3b8; --hero-track: rgba(255,255,255,.14);
    --warn: #b45309; --warn-soft: #fef3c7; --ok: #047857; --ok-soft: #d1fae5;
    --err: #b91c1c; --err-soft: #fee2e2;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 30px rgba(15,23,42,.07);
    --f-display: "Inter Display", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #070d18; --surface: #0f1726; --ink: #e8eef6; --mut: #8a9bb0; --line: #1e2a3d;
    --accent: #2dd4bf; --accent-2: #38bdf8; --accent-ink: #04201c; --accent-soft: #0f3a37; --track: #1e2a3d;
    --hero-a: #0f1d33; --hero-b: #0d4a54;
    --warn: #fbbf24; --warn-soft: #3a2a08; --ok: #34d399; --ok-soft: #0b3326;
    --err: #fca5a5; --err-soft: #3d1414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #070d18; --surface: #0f1726; --ink: #e8eef6; --mut: #8a9bb0; --line: #1e2a3d;
    --accent: #2dd4bf; --accent-2: #38bdf8; --accent-ink: #04201c; --accent-soft: #0f3a37; --track: #1e2a3d;
    --hero-a: #0f1d33; --hero-b: #0d4a54;
    --warn: #fbbf24; --warn-soft: #3a2a08; --ok: #34d399; --ok-soft: #0b3326;
    --err: #fca5a5; --err-soft: #3d1414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
         background: radial-gradient(900px 420px at 50% -120px, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg);
         min-height: 100vh; padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .shell { max-width: 680px; margin: 0 auto; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 22px 0 6px; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; flex: none;
          box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
  .mark svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .brand { font: 700 17px/1.15 var(--f-display); letter-spacing: -.01em; }
  .tag { font-size: 13px; color: var(--mut); }

  .hero { padding: 30px 0 6px; }
  h1 { font: 800 clamp(32px, 8vw, 46px)/1.04 var(--f-display); letter-spacing: -.035em; margin: 0 0 10px; text-wrap: balance; }
  .lead { color: var(--mut); margin: 0 0 22px; max-width: 46ch; }
  form { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  input { flex: 1 1 200px; min-width: 0; padding: 13px 14px; border: 0; border-radius: 11px; font: 600 18px var(--f-mono);
          letter-spacing: .05em; text-transform: uppercase; background: transparent; color: var(--ink); }
  input::placeholder { color: var(--mut); opacity: .6; font-weight: 500; }
  input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
  button { padding: 13px 22px; border: 0; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
           font: 600 16px var(--f-body); cursor: pointer; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
  button:disabled { opacity: .6; cursor: default; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-top: 18px; box-shadow: var(--shadow); }
  .err { background: var(--err-soft); color: var(--err); border-color: transparent; font-weight: 500; box-shadow: none; }

  /* Carte de statut : fond sombre degrade */
  #result article:first-child { position: relative; overflow: hidden; border: 0; color: var(--hero-ink);
    background: radial-gradient(500px 240px at 100% 0%, rgba(45,212,191,.28), transparent 70%), linear-gradient(150deg, var(--hero-a), var(--hero-b)); }
  #result article:first-child .label, #result article:first-child .eta span, #result article:first-child dt { color: var(--hero-mut); }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
  .code { font: 600 21px var(--f-mono); letter-spacing: .05em; margin-top: 2px; }
  .phase { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(45,212,191,.16); color: #5eead4;
           border: 1px solid rgba(94,234,212,.3); }
  .phase.ok { background: rgba(52,211,153,.16); color: #6ee7b7; border-color: rgba(110,231,183,.3); }
  .status { font: 800 clamp(26px, 6.5vw, 34px)/1.08 var(--f-display); letter-spacing: -.025em; margin: 16px 0 24px; text-wrap: balance; }

  .route { margin: 0 0 6px; }
  .ends { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .ends span:last-child { text-align: right; }
  .track { position: relative; height: 6px; border-radius: 3px; background: var(--hero-track); margin: 0 10px; }
  .track #bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #2dd4bf, #38bdf8); transition: width .6s ease; width: 0; }
  .track .dot { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--hero-a); border: 2px solid rgba(255,255,255,.28); }
  .track .dot.on { border-color: #5eead4; background: #5eead4; }
  .track #ship { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #fff;
                 border: 5px solid #38bdf8; box-shadow: 0 0 0 6px rgba(56,189,248,.22), 0 0 24px rgba(56,189,248,.6); transition: left .6s ease; left: 0; }

  .eta { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); }
  .eta strong { font: 800 34px/1 var(--f-display); letter-spacing: -.03em;
                background: linear-gradient(90deg, #5eead4, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eta span { color: var(--mut); }
  .eta.late strong { background: none; color: #fbbf24; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; margin: 18px 0 0; font-size: 14px; }
  dt { color: var(--mut); }
  dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

  h2 { font: 700 17px var(--f-display); letter-spacing: -.01em; margin: 0 0 20px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { position: relative; padding: 0 0 22px 36px; }
  li::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 0; width: 2px; background: var(--line); border-radius: 1px; }
  li:last-child { padding-bottom: 0; }
  li:last-child::before { display: none; }
  li.done::before { background: linear-gradient(var(--accent), var(--accent-2)); }
  .pt { position: absolute; left: 2px; top: 3px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
  li.done .pt { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
  li.now .pt { background: var(--accent-2); border-color: var(--accent-2); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent-2) 22%, transparent); }
  .ev-t { font-weight: 600; }
  li.now .ev-t { color: var(--accent-2); }
  li.todo .ev-t { color: var(--mut); font-weight: 500; opacity: .8; }
  .ev-m { color: var(--mut); font-size: 13px; }
  .contact { font-size: 14px; color: var(--mut); margin: 18px 4px 0; text-align: center; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .track #bar, .track #ship { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15l2 4h14l2-4H3z"/><path d="M5 15V9h14v6"/><path d="M12 9V4h4"/></svg></div>
    <div><div class="brand" id="title">Suivi de colis</div><div class="tag">Chine - Gabon</div></div>
  </header>

  <section class="hero">
    <h1>Où est mon colis&nbsp;?</h1>
    <p class="lead">Entrez le code reçu sur WhatsApp ou inscrit sur votre bordereau.</p>
    <form id="form">
      <input id="code" type="text" placeholder="GC-8F3K29AB" autocomplete="off" autocapitalize="characters" aria-label="Code de suivi" required>
      <button id="btn" type="submit">Suivre mon colis</button>
    </form>
  </section>

  <div class="card err" id="error" role="alert" hidden></div>

  <div id="result" hidden>
    <article class="card">
      <div class="row-top">
        <div><div class="label">Code de suivi</div><div class="code" id="codeOut"></div></div>
        <span class="phase" id="phase"></span>
      </div>
      <div class="status" id="status"></div>
      <div class="route">
        <div class="ends"><span id="orig"></span><span id="dest"></span></div>
        <div class="track" id="track"><span id="bar"></span><span id="ship"></span></div>
      </div>
      <div class="eta" id="eta"></div>
      <dl id="details"></dl>
    </article>
    <article class="card">
      <h2>Les étapes du voyage</h2>
      <ol id="events"></ol>
    </article>
    <p class="contact" id="contact" hidden></p>
  </div>
</div>

<script src="config.js"></script>
<script src="suivi.js"></script>
</body>
</html>
