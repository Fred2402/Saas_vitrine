<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de colis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Concept : un trajet maritime Chine - Gabon lu de gauche a droite, ponctue d'etapes datees */
  :root {
    --bg: #eef2f5; --surface: #ffffff; --ink: #0c2236; --mut: #5a6b7b; --line: #d5dee6;
    --accent: #0e7c86; --accent-ink: #ffffff; --accent-soft: #d9eef0; --track: #cfdae3;
    --warn: #8a5200; --warn-soft: #fbeed6; --ok: #17703f; --ok-soft: #dcf1e5;
    --err: #b3261e; --err-soft: #fbe4e2;
    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #09141e; --surface: #102130; --ink: #e8eff5; --mut: #8ea2b4; --line: #213648;
    --accent: #4fc3cd; --accent-ink: #04222a; --accent-soft: #12373f; --track: #24384a;
    --warn: #f0b45a; --warn-soft: #3a2c10; --ok: #66d49a; --ok-soft: #123824;
    --err: #ff9a92; --err-soft: #3d1b19; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #09141e; --surface: #102130; --ink: #e8eff5; --mut: #8ea2b4; --line: #213648;
    --accent: #4fc3cd; --accent-ink: #04222a; --accent-soft: #12373f; --track: #24384a;
    --warn: #f0b45a; --warn-soft: #3a2c10; --ok: #66d49a; --ok-soft: #123824;
    --err: #ff9a92; --err-soft: #3d1b19; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body);
         padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .shell { max-width: 680px; margin: 0 auto; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 20px 0 8px; }
  .mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .mark svg { width: 22px; height: 22px; fill: none; stroke: var(--accent-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .brand { font: 700 18px/1.1 var(--f-display); }
  .tag { font-size: 13px; color: var(--mut); }

  .hero { padding: 28px 0 8px; }
  h1 { font: 700 clamp(30px, 8vw, 44px)/1.05 var(--f-display); letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
  .lead { color: var(--mut); margin: 0 0 20px; max-width: 46ch; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 200px; min-width: 0; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; font: 600 18px var(--f-mono);
          letter-spacing: .04em; text-transform: uppercase; background: var(--surface); color: var(--ink); }
  input::placeholder { color: var(--mut); opacity: .7; font-weight: 500; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { padding: 14px 24px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 600 16px var(--f-body); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 18px; }
  .err { background: var(--err-soft); color: var(--err); border-color: transparent; font-weight: 500; }

  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  .code { font: 600 22px var(--f-mono); letter-spacing: .04em; }
  .phase { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .phase.ok { background: var(--ok-soft); color: var(--ok); }
  .status { font: 700 clamp(24px, 6vw, 32px)/1.1 var(--f-display); letter-spacing: -.01em; margin: 14px 0 22px; text-wrap: balance; }

  .route { margin: 0 0 6px; }
  .ends { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .ends span:last-child { text-align: right; }
  .track { position: relative; height: 6px; border-radius: 3px; background: var(--track); margin: 0 8px; }
  .track #bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); transition: width .6s ease; width: 0; }
  .track .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--track); }
  .track .dot.on { border-color: var(--accent); background: var(--accent); }
  .track #ship { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--surface);
                 border: 3px solid var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); transition: left .6s ease; left: 0; }

  .eta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .eta strong { font: 700 28px/1 var(--f-display); }
  .eta span { color: var(--mut); }
  .eta.late strong { color: var(--warn); }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; margin: 18px 0 0; font-size: 14px; }
  dt { color: var(--mut); }
  dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

  h2 { font: 700 18px var(--f-display); margin: 0 0 18px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { position: relative; padding: 0 0 20px 34px; }
  li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: -2px; width: 2px; background: var(--line); }
  li:last-child { padding-bottom: 0; }
  li:last-child::before { display: none; }
  li.done::before { background: var(--accent); }
  .pt { position: absolute; left: 3px; top: 4px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
  li.done .pt { background: var(--accent); border-color: var(--accent); }
  li.now .pt { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
  .ev-t { font-weight: 600; }
  li.todo .ev-t { color: var(--mut); font-weight: 500; }
  .ev-m { color: var(--mut); font-size: 13px; }
  .contact { font-size: 14px; color: var(--mut); margin: 18px 4px 0; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .track #bar, .track #ship { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 15l2 4h14l2-4H3z"/><path d="M5 15V9h14v6"/><path d="M12 9V4h4"/></svg></div>
    <div><div class="brand" id="title">Suivi de colis</div><div class="tag">Chine - Gabon</div></div>
  </header>

  <section class="hero">
    <h1>Où est mon colis&nbsp;?</h1>
    <p class="lead">Entrez le code reçu sur WhatsApp ou inscrit sur votre bordereau.</p>
    <form id="form">
      <input id="code" type="text" placeholder="GC-8F3K29AB" autocomplete="off" autocapitalize="characters" aria-label="Code de suivi" required>
      <button id="btn" type="submit">Suivre mon colis</button>
    </form>
  </section>

  <div class="card err" id="error" role="alert" hidden></div>

  <div id="result" hidden>
    <article class="card">
      <div class="row-top">
        <div><div class="label">Code de suivi</div><div class="code" id="codeOut"></div></div>
        <span class="phase" id="phase"></span>
      </div>
      <div class="status" id="status"></div>
      <div class="route">
        <div class="ends"><span id="orig"></span><span id="dest"></span></div>
        <div class="track" id="track"><span id="bar"></span><span id="ship"></span></div>
      </div>
      <div class="eta" id="eta"></div>
      <dl id="details"></dl>
    </article>
    <article class="card">
      <h2>Les étapes du voyage</h2>
      <ol id="events"></ol>
    </article>
    <p class="contact" id="contact" hidden></p>
  </div>
</div>

<script src="config.js"></script>
<script src="suivi.js"></script>
</body>
</html>
